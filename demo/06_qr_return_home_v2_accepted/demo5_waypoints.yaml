# Demo6 V2: both outbound and homecoming legs use POINT (NO obstacle avoidance).
# The Demo coordinate frame is captured from DISARMED nose yaw at each session.
fence:
  forward_min: -1.0
  forward_max:  6.0
  left_min:    -2.0
  left_max:     2.0
  height_min:  -0.25
  height_max:   1.30
flight_height: 0.80
segment_timeout_s: 90.0
waypoint_margin: 0.20
waypoints:
  - {forward: 0.5, left: -0.5, mode: POINT}  # P1: arrive, scan QR
  - {forward: 0.0, left:  0.0, mode: POINT}  # P2: return to takeoff XY, land
